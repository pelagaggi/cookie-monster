<html lang="en">

<title>no banner</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 40px; }
  .banner { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 24px; background: #222; color: #fff; display: flex; gap: 12px; align-items: center; }

  .banner button { padding: 10px 18px; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }

</style>

<p>An ordinary page. Nothing should happen.</p>
<button onclick="document.title = 'clicked'">Accept</button>
