<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>late banner</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 40px; }
  .banner { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 24px; background: #222; color: #fff; display: flex; gap: 12px; align-items: center; }
  .banner p { flex: 1; margin: 0; }
  .banner button { padding: 10px 18px; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
  .banner .accept { background: #2ecc71; color: #fff; }
</style>
<h1>Late banner</h1>
<p>The banner is injected after 3 seconds.</p>
<script>
  function answer(result) {
    document.title = result;
    (document.querySelector(".banner") || document.querySelector("#host")).remove();
  }
</script>
<script>
  setTimeout(() => {
    document.body.insertAdjacentHTML('beforeend', `
      <div class="banner">
        <p>This site uses cookies.</p>
        <button onclick="answer('rejected')">Decline</button>
        <button class="accept" onclick="answer('accepted')">I agree</button>
      </div>`);
  }, 3000);
</script>
</html>
