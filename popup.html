<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cookie Monster</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 220px;
      font: 14px/1.4 system-ui, sans-serif;
      color: #fff;
      background: #2f6fe0;
    }
    h1 { margin: 0 0 12px; font-size: 18px; }
    label { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
    input { width: 18px; height: 18px; accent-color: #ffd60a; }
    p { margin: 12px 0 0; font-size: 12px; opacity: .85; }
  </style>
</head>
<body>
  <h1>Cookie Monster</h1>
  <label><input type="checkbox" id="enabled"> Eat cookie banners</label>
  <label><input type="checkbox" id="sound"> Om nom nom sounds</label>
  <p>Changes apply to pages you load next.</p>
  <script src="popup.js"></script>
</body>
</html>
